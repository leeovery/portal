name: zmx check

# Portal's formula depends on official zmx, which Homebrew upgrades freely, so
# this runs the zmx-backed tests against zmx's latest release and its main
# branch: every test that runs a real zmx. The release leg takes the macOS
# build zmx publishes, the one Homebrew installs, rather than building the
# release's source: 1.0.0's published macOS builds carried Linux's ioctl
# numbers, which a build from source never shows. A leg tests only a zmx newer
# than the last passing run (a release published, or a main commit made, since
# it started), since one that passed already is known to work; a run started
# by hand tests both legs whatever their age. zmxtest.Binary fails a test these
# lines don't run, and reads them strictly (internal/zmxtest/weeklycheck.go):
# keep each to -tags integration, -p 1, -timeout, one single-quoted -run and
# ./ packages, in a run: | block holding nothing else, and set neither Go's
# flags variable nor a step's working directory anywhere here: naming either
# fails the read. A failed run is the alert: GitHub emails it.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  zmx:
    name: zmx ${{ matrix.leg }}
    # zmxtest proves which processes it owns through kern.procargs2, so the
    # tests run on macOS only.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        leg: [release, main]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve zmx
        id: zmx
        env:
          LEG: ${{ matrix.leg }}
        run: |
          if [ "$LEG" = release ]; then
            read -r tag dated <<< "$(gh api repos/neurosnap/zmx/releases/latest --jq '.tag_name + " " + .published_at')"
            echo "zmx's latest release is $tag, published $dated"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "dated=$dated" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r commit dated <<< "$(gh api repos/neurosnap/zmx/commits/main --jq '.sha + " " + .commit.committer.date')"
          echo "dated=$dated" >> "$GITHUB_OUTPUT"
          zig=$(gh api "repos/neurosnap/zmx/contents/build.zig.zon?ref=$commit" -H 'Accept: application/vnd.github.raw' \
            | sed -n 's/.*\.minimum_zig_version *= *"\([^"]*\)".*/\1/p')
          if [ -z "$zig" ]; then
            echo "::error::no minimum_zig_version in zmx main ($commit) build.zig.zon"
            exit 1
          fi
          echo "zmx main is $commit, built with Zig $zig"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "zig=$zig" >> "$GITHUB_OUTPUT"

      # GitHub's timestamps are all UTC in one format, so they compare as text.
      - name: Anything new
        id: new
        env:
          EVENT: ${{ github.event_name }}
          DATED: ${{ steps.zmx.outputs.dated }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "Started by hand, so it tests this zmx whatever its age"
            echo "test=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/zmx-check.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].run_started_at // ""')
          if [ -n "$last" ] && [[ ! "$DATED" > "$last" ]]; then
            echo "Nothing new: this zmx dates from $DATED, before the last passing check started ($last)"
            echo "test=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "New since the last passing check (${last:-none}): this zmx dates from $DATED"
          echo "test=true" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        if: matrix.leg == 'main' && steps.new.outputs.test == 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zmx.outputs.zig }}

      - name: Setup Go
        if: steps.new.outputs.test == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build zmx
        if: matrix.leg == 'main' && steps.new.outputs.test == 'true'
        env:
          COMMIT: ${{ steps.zmx.outputs.commit }}
        run: |
          binary=$(scripts/zmx-build "$COMMIT")
          echo "PORTAL_TEST_ZMX_BINARY=$binary" >> "$GITHUB_ENV"

      - name: Download zmx
        if: matrix.leg == 'release' && steps.new.outputs.test == 'true'
        env:
          TAG: ${{ steps.zmx.outputs.tag }}
        run: |
          case $(uname -m) in
          arm64) arch=aarch64 ;;
          x86_64) arch=x86_64 ;;
          *) echo "::error::zmx publishes no macOS build for $(uname -m)"; exit 1 ;;
          esac
          asset="zmx-${TAG#v}-macos-$arch.tar.gz"
          dir="$RUNNER_TEMP/zmx-release"
          mkdir -p "$dir"
          gh release download "$TAG" --repo neurosnap/zmx --pattern "$asset" --pattern "$asset.sha256" --dir "$dir"
          want=$(cut -d ' ' -f 1 "$dir/$asset.sha256")
          got=$(shasum -a 256 "$dir/$asset" | cut -d ' ' -f 1)
          if [ "$want" != "$got" ]; then
            echo "::error::$asset is $got, but its published checksum is $want"
            exit 1
          fi
          tar -xzf "$dir/$asset" -C "$dir" zmx
          echo "zmx $TAG's published build is $asset ($got)"
          echo "PORTAL_TEST_ZMX_BINARY=$dir/zmx" >> "$GITHUB_ENV"

      - name: Test
        if: steps.new.outputs.test == 'true'
        run: |
          go test -tags integration -p 1 -timeout 30m ./internal/backend/zmx/... ./internal/runner/... ./internal/saverhost/... ./internal/spawn/... ./internal/zmxtest/...
          go test -tags integration -p 1 -timeout 30m -run 'AgainstZmx$' ./cmd ./internal/portaltest ./internal/restore ./internal/vtcapture
