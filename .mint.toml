# .mint.toml — mint configuration. Only non-default overrides are set here;
# every other key uses mint's compiled defaults. Run `mint setup` for the full
# key reference.

# Tooling/workflow artifacts and test/doc assets (not shipped product behaviour),
# kept out of the AI notes/commit diff so release notes and commit messages
# describe the CLI, not workflow specs, agent definitions, task-tracking state,
# test scaffolding, or visual fixtures. The test exclusion is load-bearing: for a
# large feature, *_test.go (especially byte-exact golden fixtures) can be the bulk
# of the diff and overflow the notes-AI context ("Prompt is too long").
diff_exclude = [
    '.workflows/**',  # workflow specs/plans/knowledge (1.5k markdown files)
    '.claude/**',     # Claude Code agents, skills, settings
    '.agntc/**',      # agent tooling manifest
    '.tick/**',       # task-tracking state (multi-MB jsonl)
    '**/*_test.go',   # Go tests, incl. large byte-exact golden fixtures (the dominant diff-size contributor); notes describe behaviour, not test scaffolding
    'testdata/**',    # vhs capture tapes + reference/capture PNGs (visual-test fixtures)
    'art/**',         # README screenshot + demo-clip assets (docs, not source)
    'demo/**',        # demo tapes and their recording scripts: vhs runs capturetool, which plays each scenario in-process
]

[release.hooks]
# No CI job builds a release: it happens on this Mac, before the irreversible
# tag + push. scripts/release-build builds the binaries and keeps them, so a
# failure about the build or the binary stops the release before its tag,
# with nothing public yet.
pre_tag = ['scripts/release-build']
# Once the tag and the release are up: scripts/release-upload uploads the
# kept binaries to the release and moves the Homebrew formula on to them.
# mint only warns when it fails, so scripts/release-upload <version>, run by
# hand, finishes the release.
post_release = ['scripts/release-upload']

[release]
diff_exclude = ["internal/capture/fixtures.go", ".github/workflows/", "CLAUDE.md", "docs/design/", "internal/backend/zmx/testdata/", "internal/backendtest/", "internal/capture/", "cmd/capturetool/", "internal/commandertest/", "internal/commitlock/commitlocktest.go", "internal/devversion/testdata/", "internal/fileutil/synctest.go", "internal/harnesstest/", "internal/hookstest/", "internal/portalbintest/", "internal/portaltest/", "internal/proctest/", "internal/restoretest/", "internal/sourceguardtest/", "internal/spawntest/", "internal/statetest/", "internal/state/commitlocktest.go", "internal/tmuxtest/", "internal/transienttest/", "internal/zmxtest/", "main_test.go", "scripts/release-build", "scripts/release-common", "scripts/release-upload", "scripts/zmx-build", "scripts/zmx-commit", ".gitignore", "go.sum"]
