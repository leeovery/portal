# golangci-lint v2 config (run: `golangci-lint run`).
# Not wired into CI by design — Portal is verified at release time via the
# Mint tool. This config exists so that lint, run locally or from the release
# step, enforces a consistent baseline and keeps modernization from drifting.
version: "2"

run:
  # Every file behind `//go:build integration` is invisible to a linter that
  # analyses only the default tags. Enabling the tag here rather than asking
  # for a second `--build-tags integration` invocation puts them in scope of a
  # bare `golangci-lint run`: with no CI, a step that depends on someone
  # recalling a flag is a step that stops running. A file gated
  # `//go:build !integration` is swapped out of the build under this tag, so
  # this run does not analyse it.
  build-tags:
    - integration

issues:
  # Report every finding. The defaults (3 of a kind, 50 per linter) silently
  # truncate a sweep's real count.
  max-same-issues: 0
  max-issues-per-linter: 0

linters:
  # The standard set: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    # Flags code that can be rewritten with newer Go stdlib/idioms
    # (min/max, range-over-int, strings.Cut/SplitSeq, slices/maps, etc.).
    # The whole reason this config exists; keep it enabled.
    - modernize
  exclusions:
    rules:
      # TestMain poisons the environment to force per-test isolation. It must
      # use os.Setenv (no *testing.T exists in TestMain, so t.Setenv is
      # unavailable). Setenv fails only on an empty key, a '=' or NUL byte in
      # the key, or a NUL byte in the value; every key it sets is a constant
      # name and every value a literal or a filesystem path, so none of those
      # is reachable here.
      # See any testmain_isolation_test.go header for rationale.
      - path: testmain_isolation_test\.go
        linters:
          - errcheck
        source: os\.Setenv
